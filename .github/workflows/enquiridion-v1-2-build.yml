name: Build Enquiridion Pixel 9 Install-Safe APK

on:
  push:
    branches:
      - build-enquiridion-v1-2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded project
        run: |
          mkdir -p work
          cat build-input/v12/chunk_*.b64 | tr -d '\n\r ' | base64 -d > work/project.zip
          unzip -q work/project.zip -d work
          test -f work/enquiridion/app/build.gradle
          unzip -t work/project.zip >/dev/null

      - name: Make install-safe Pixel 9 build
        run: |
          cat > work/enquiridion/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          sed -i 's/applicationId "com\.menteestoica\.enquiridion"/applicationId "com.menteestoica.enquiridion.pixel9"/' work/enquiridion/app/build.gradle
          sed -i 's/versionCode 16/versionCode 17/' work/enquiridion/app/build.gradle
          sed -i 's/versionName "1\.2"/versionName "1.2.1"/' work/enquiridion/app/build.gradle
          grep -nE 'applicationId|versionCode|versionName' work/enquiridion/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile installable debug APK
        run: gradle -p work/enquiridion :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s work/enquiridion/app/build/outputs/apk/debug/app-debug.apk
          cp work/enquiridion/app/build/outputs/apk/debug/app-debug.apk Enquiridion-Estoico-Pixel9-v1.2.1.apk
          sha256sum Enquiridion-Estoico-Pixel9-v1.2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enquiridion-Estoico-Pixel9-v1.2.1
          path: Enquiridion-Estoico-Pixel9-v1.2.1.apk
          if-no-files-found: error
