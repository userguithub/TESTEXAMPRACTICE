name: Build Enquiridion v1.2 APK

on:
  push:
    branches:
      - build-enquiridion-v1-2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded project
        run: |
          mkdir -p work
          cat build-input/v12/chunk_*.b64 | tr -d '\n\r ' | base64 -d > work/project.zip
          unzip -q work/project.zip -d work
          test -f work/enquiridion/app/build.gradle
          unzip -t work/project.zip >/dev/null

      - name: Enable AndroidX
        run: |
          cat > work/enquiridion/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20 || true
          ls "$ANDROID_HOME/build-tools" | tail -20 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        run: gradle -p work/enquiridion :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enquiridion-Estoico-v1.2-APK
          path: work/enquiridion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
